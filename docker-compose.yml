services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-lake}
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweedfs_data:/data

  pipeline:
    profiles: ["pipeline"]
    build: .
    environment:
      # localhost aqui seria o próprio container, não a máquina
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me}
      S3_BUCKET: ${S3_BUCKET:-lake}
      TZ: America/Sao_Paulo
      REQUESTS_CA_BUNDLE: /certs/ca-certificates.crt
      SSL_CERT_FILE: /certs/ca-certificates.crt
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/certs/ca-certificates.crt:ro
      - ./src:/app/src
      - ./sql:/app/sql
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    depends_on:
      - seaweedfs

volumes:
  seaweedfs_data:
